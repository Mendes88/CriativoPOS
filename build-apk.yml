name: Build Criativo POS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate app icons
        run: |
          pip install Pillow --quiet
          python3 << 'EOF'
import base64, os
from PIL import Image
import io

b64 = ""
img = Image.open(io.BytesIO(base64.b64decode(b64)))
sizes = {
    'CriativoPOS/app/src/main/res/mipmap-mdpi': 48,
    'CriativoPOS/app/src/main/res/mipmap-hdpi': 72,
    'CriativoPOS/app/src/main/res/mipmap-xhdpi': 96,
    'CriativoPOS/app/src/main/res/mipmap-xxhdpi': 144,
    'CriativoPOS/app/src/main/res/mipmap-xxxhdpi': 192,
}
for folder, size in sizes.items():
    os.makedirs(folder, exist_ok=True)
    icon = img.resize((size, size), Image.LANCZOS).convert('RGBA')
    bg = Image.new('RGBA', (size, size), (255,255,255,255))
    bg.paste(icon, mask=icon.split()[3])
    out = bg.convert('RGB')
    out.save(f'{folder}/ic_launcher.png')
    out.save(f'{folder}/ic_launcher_round.png')
print('Icons generated')
EOF

      - name: Build Release APK
        run: |
          cd CriativoPOS
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/criativo-pos.keystore \
            -Pandroid.injected.signing.store.password=Criativo2024! \
            -Pandroid.injected.signing.key.alias=criativo-pos \
            -Pandroid.injected.signing.key.password=Criativo2024! \
            --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CriativoPOS-Release
          path: "**/*-release.apk"
